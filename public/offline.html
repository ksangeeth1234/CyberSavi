<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — SafeSpace LK</title>
  <style>
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 420px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.08);
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin: 16px 0 8px; color: #1e293b; }
    p { color: #64748b; font-size: 0.9rem; line-height: 1.6; margin: 0 0 24px; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: #f1f5f9; color: #64748b;
      padding: 6px 14px; border-radius: 999px; font-size: 0.8rem; font-weight: 500;
      margin-bottom: 24px;
    }
    a {
      display: inline-block; background: #2563eb; color: white;
      text-decoration: none; font-weight: 600; font-size: 0.9rem;
      padding: 12px 28px; border-radius: 10px; transition: background 0.2s;
    }
    a:hover { background: #1d4ed8; }
    .icon { font-size: 48px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <div class="badge">⚡ SafeSpace LK</div>
    <p>
      You're currently offline. The analysis engine works locally and doesn't require internet access.
      However, this page needs to be cached first.
    </p>
    <p>
      Map tiles and any external resources may not be available until you reconnect.
    </p>
    <a href="/">Try Again</a>
  </div>
</body>
</html>
